name: PR Test Agent

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      init_mode:
        description: 'Run in init mode to generate baseline tests for all pages'
        type: boolean
        default: false
      preview_url:
        description: 'Preview URL to test against (optional, will wait for Vercel if not provided)'
        type: string
        required: false
      pr_number:
        description: 'PR number to comment results on (optional)'
        type: string
        required: false

concurrency:
  group: pr-test-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install agent dependencies
        working-directory: ./agent
        run: npm install

      - name: Build agent
        working-directory: ./agent
        run: npm run build

      - name: Run Test Agent
        working-directory: ./agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref || 'main' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number || '0' }}
          PREVIEW_URL: ${{ github.event.inputs.preview_url || '' }}
        run: node dist/index.js ${{ github.event.inputs.init_mode == 'true' && '--init' || '' }}
